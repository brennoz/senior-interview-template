spring:
  application:
    name: ec-temp-int
  datasource:
    url: jdbc:h2:mem:elemental-int;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ec
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

work-items:
  pagination:
    default-page-size: 20
    max-page-size: 100
    default-sort-field: createdAt
    default-sort-direction: DESC

logging:
  level:
    root: INFO
    com.elemental.tech: DEBUG
    org.hibernate.SQL: WARN
